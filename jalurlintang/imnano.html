<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Gebuk Pantas GPv1.0 by Jalur Lintang — part of the IM-Nano Inventory Management System. View the operational diagram and product details." />
    <title>Jalur Lintang - Inventory Management System</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="page-container">

        <!-- HEADER -->
        <header class="header">
            <div class="planet-logo">
                <a href="imnano.html">
                    <img src="../images/logo-child5.png" alt="Jalur Lintang" />
                </a>
            </div>

            <div class="title-block">
                <h1 class="main-title">JALUR LINTANG</h1>
            </div>

            <div class="logo-wrap">
                <div class="sun-logo">
                    <a href="../index.html">
                        <img src="../images/logo.png" alt="masaneubotics" />
                    </a>
                </div>

                <span class="tooltip">masaneubotics</span>
            </div>

        </header>

        <!-- SYSTEM NAME -->
        <h2 class="system-name">Inventory Management System (IM-Nano)</h2>

        <!-- PRODUCT SELECTION -->
        <form class="product-list" id="productList">
            <!-- Radio options are generated by JS -->
        </form>

        <!-- OPERATIONAL DIAGRAM BOX -->
        <section class="diagram-box" id="diagramBox">
            <div class="diagram-placeholder" id="diagramPlaceholder">
                <p>Select a product to view its operational diagram</p>
            </div>
            <img id="diagramImage" class="diagram-image" src="" alt="Operational Diagram" />
        </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
